name: Tests

on:
  push:
    branches: ["**"]
  pull_request:
    branches: ["**"]

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r Stage 4/Week_4bookmarks-app2/requirements.txt

      - name: Run tests
        run: pytest Stage 4/Week_4/bookmarks-app2/tests/
        env:
          SECRET_KEY: ci-test-secret