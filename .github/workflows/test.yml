name: Tests

on:
  push:
    paths:
      - 'Stage 4/Week_4/**'
  pull_request:
    paths:
      - 'Stage 4/Week_4/**'

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        working-directory: Stage 4/Week_4/bookmarks-app2
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run tests
        working-directory: Stage 4/Week_4/bookmarks-app2
        run: pytest tests/
        env:
          SECRET_KEY: ci-test-secret
          PYTHONPATH: .