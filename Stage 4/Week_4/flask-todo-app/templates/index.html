<!DOCTYPE html>
<html>
<head>
    <title>Flask todo App</title>
    <style>
        body { font-family: Arial, sans-serif; margin: 40px; }
        .completed { text-decoration: line-through; color: #888; }
        ul { list-style: none; padding: 0 }
        li { padding: 10px; background: #f8f9fa; margin: 5px 0; border-radius: 5px }
    </style>
</head>
<body>
    <h1>✅ My Flask Todo List</h1>

    <form method="POST" action="/add">
        <input type="text" name="title" placeholder="What needs to be done?" required style="padding:10px; width:70%;">
        <button type="submit" style="padding:10px 20px;">Add Todo</button> 
    </form>

    <ul>
        {% for todo in todos %}
        <li class="{% if todo.completed %}completed{% endif %}">
            <a href="{{ url_for('toggle', todo_id=todo.id) }}">
                {{ todo.title }}
            </a>
        </li>
        {% endfor %}
    </ul>

    <p>Total todos: {{ todos|length }}</p>
</body>
</html>
