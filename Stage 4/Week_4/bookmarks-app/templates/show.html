{% extends "base.html" %}
{% block title %}{{ bookmark.title}} &mdash; Bookmarks{% endblock %}
{% block content %}
    <h2>{{ bookmark.title }}</h2>
    <h5>{{ bookmark.description }}</h5>
    <p><a href="{{ bookmark.url }}">{{ bookmark.url }}</a></p>
    <p><a href="{{ url_for('index')}}">&larr; Back to list</a></p>
    <form method="post" action="{{ url_for('delete', bookmark_id=bookmark.id) }}">
        <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
        <button type="submit">Delete</button>
    </form>
{% endblock %}
