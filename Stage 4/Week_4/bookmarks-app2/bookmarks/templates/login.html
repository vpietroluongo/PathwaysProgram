{% extends "base.html" %}
{% block title %}Log in{% endblock %}
{% block content %}
    <h2>Log in</h2>
    <form method="post">
        {{ form.hidden_tag() }}

        <label>{{ form.email.label }} {{form.email()}}</label>
        {% for error in form.email.errors %}
            <p class="muted">{{ error }}</p>
        {% endfor %}

        <label>{{ form.password.label}} {{ form.password() }}</label>
        {% for error in form.password.errors %}
            <p class="muted">{{ error }}</p>
        {% endfor %}

        {{ form.submit() }}
    </form>
{% endblock %}
