{% extends 'base.html' %}
{% block title %}Login | ChatFlow{% endblock %}

{% block content %}
<div class="row justify-content-center mt-5">
  <div class="col-12 col-md-6 col-lg-4">
    <div class="card border-0 shadow-sm">
      <div class="card-body p-4">
        <h1 class="h4 mb-3">Sign in to ChatFlow</h1>
        <p class="text-secondary small">Use a username to join or create rooms.</p>
        <form method="post" action="{{ url_for('chat.login') }}" class="mt-4">
          <div class="mb-3">
            <label class="form-label" for="username">Username</label>
            <input id="username" name="username" type="text" class="form-control" maxlength="80" required autofocus>
          </div>
          <button class="btn btn-primary w-100" type="submit">Continue</button>
        </form>
      </div>
    </div>
  </div>
</div>
{% endblock %}
